name: CI Pipeline

# Run this workflow on every push and pull request targeting main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------
      # 1. Check out the repository code
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      # -----------------------------------------------------------------
      # 4. Run a syntax / lint check
      # -----------------------------------------------------------------
      - name: Run flake8 syntax check
        run: |
          # Stop the build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Full lint pass (warnings only, does not fail the build)
          flake8 . --count --max-line-length=100 --exit-zero --statistics

      # -----------------------------------------------------------------
      # 5. Run application tests
      # -----------------------------------------------------------------
      - name: Run Flask application tests
        run: |
          python -m pip install pytest
          pytest -v

      # -----------------------------------------------------------------
      # 6. Build the Docker image
      # -----------------------------------------------------------------
      - name: Build Docker image
        run: docker build -t devops-flask-app:${{ github.sha }} .

      # -----------------------------------------------------------------
      # 7. Verify the Docker image was built successfully
      # -----------------------------------------------------------------
      - name: Verify Docker image
        run: docker images devops-flask-app:${{ github.sha }}
